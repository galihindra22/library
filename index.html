<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        body{
            display: grid;
            min-height: 100vh;
            grid-template-columns: repeat(auto-fit, 160px);
            gap: 10px;
            justify-content: center;
            align-content: center;
            
        }
        p{
            padding: 10px;
            
        }
    </style>
</head>

<body>

</body>
<script>
    const myLibrary = [];

    function Book(title, author, pages, isRead) {
        if (!new.target) {
            throw Error("You must use the 'new' operator to call the constructor");
        }
        this.title = title;
        this.author = author;
        this.pages = pages;
        if (isRead === false) {
            this.isRead = "not read yet"
        }
        else if (isRead) {
            this.isRead = "has been read"
        }
        this.info = function () {
            console.log(`${this.title} by ${this.author}, ${this.pages} pages, ${this.isRead}`);
        };
    }
    function addBookToLibrary(title, author, pages, isRead) {
        const book = new Book(title, author, pages, isRead);
        myLibrary.push(book);
    }
    function display() {
        myLibrary.forEach(element => {
            const cards = document.createElement('div');
            const author = document.createElement('p');
            const title = document.createElement('p');
            const pages = document.createElement('p');
            const isRead = document.createElement('p');

            author.textContent = element.author;
            title.textContent = element.title;
            pages.textContent = element.pages;
            isRead.textContent = element.isRead;

            cards.style.backgroundColor = 'aqua';

            cards.appendChild(title);
            cards.appendChild(author);
            cards.appendChild(pages);
            cards.appendChild(isRead);
            document.body.appendChild(cards);
        });
    }
    
    addBookToLibrary("The Hobbit", "J.R.R. Tolkien", 295, false);
    addBookToLibrary("Harry Potter", "J. K. Rowling", 766, false);
    display();
</script>

</html>
