<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div, h1{
            margin: 0;
        }

        dialog::backdrop {
            background-color: gray;
            opacity: 0.75;
        }

        .library-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, 200px);
            gap: 10px;
            justify-content: center;
            align-content: center;

        }

        .card {
            background-color: aqua;
        }

        p {
            padding: 10px;
            text-align: center;

        }

        form{
            display: flex;
            flex-direction: column;
        }

    </style>
</head>

<body>
    <dialog>
        <button autofocus>Close</button>
        <form id="add-book">
            <h2>Add Book</h2>
            <label for="title">Title</label>
            <input type="text" name="title" id="title" required>
            <label for="author">Author</label>
            <input type="text" name="author" id="author" required>
            <label for="pages">No. of pages</label>
            <input type="tel" name="pages" id="pages" required>
            <fieldset>
                <legend>Have you read the book?</legend>
                <label for="yes_answer">Yes</label>
                <input type="radio" name="question" id="yes_answer">
                <label for="no_answer">No</label>
                <input type="radio" name="question" id="no_answer">
            </fieldset>
            <button type="submit" id="submit-button">Submit</button>
        </form>

    </dialog>
    <button>New Book</button>
    <div class="library-container"></div>
    
</body>
<script>
   class Book {
        constructor(title, author, pages, isRead){
            this.title = title;
            this.author = author;
            this.pages = pages;
            this.isRead = isRead;
        }
   }
</script>

</html>
